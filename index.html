<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alex Chen - Interactive Portfolio</title>
  <meta name="description" content="Explore my professional journey through an interactive room interface - a unique portfolio experience">
  <meta name="author" content="Alex Chen">
  <meta name="theme-color" content="#3182ce">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/src/assets/favicon.svg">
  
  <!-- Open Graph / Social Media -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Alex Chen - Interactive Portfolio">
  <meta property="og:description" content="Explore my professional journey through an interactive room interface">
  <meta property="og:image" content="/src/assets/images/profile-photo.svg">
  
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Alex Chen - Interactive Portfolio">
  <meta name="twitter:description" content="Explore my professional journey through an interactive room interface">
  
  <!-- Preload critical resources -->
  <link rel="preload" href="/src/styles/room.css" as="style">
  <link rel="preload" href="/src/styles/modals.css" as="style">
  
  <!-- Styles -->
  <link rel="stylesheet" href="/src/styles/room.css">
  <link rel="stylesheet" href="/src/styles/modals.css">
  <link rel="stylesheet" href="/src/styles/puzzle.css">
  
  <!-- Loading styles -->
  <style>
    .loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #fafbfc 0%, #f1f3f5 50%, #fafbfc 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease-out;
    }
    
    .loading-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #e2e8f0;
      border-top: 3px solid #3182ce;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 1rem;
    }
    
    .loading-text {
      color: #4a5568;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      font-size: 1rem;
      font-weight: 500;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Loading screen -->
  <div id="loading-screen" class="loading-screen">
    <div class="loading-spinner"></div>
    <div class="loading-text">Loading your interactive experience...</div>
  </div>
  
  <div id="app">
    <div id="room-container" class="room-container">
      <!-- Room content will be dynamically generated -->
    </div>
    
    <!-- Recruiter mode toggle -->
    <button id="mode-toggle" class="mode-toggle" aria-label="Toggle between interactive and recruiter mode">
      Switch to Recruiter Mode
    </button>
    
    <!-- Accessibility live region for announcements -->
    <div id="announcements" aria-live="polite" aria-atomic="true" class="sr-only"></div>
  </div>
  
  <!-- Main application script -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
