<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#f8fafc"/>
  <rect x="20" y="20" width="360" height="260" fill="white" rx="8" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- Header -->
  <rect x="30" y="30" width="340" height="40" fill="#3b82f6" rx="4"/>
  <text x="200" y="55" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Task Dashboard</text>
  
  <!-- Task columns -->
  <rect x="40" y="90" width="100" height="160" fill="#f1f5f9" rx="4"/>
  <rect x="150" y="90" width="100" height="160" fill="#f1f5f9" rx="4"/>
  <rect x="260" y="90" width="100" height="160" fill="#f1f5f9" rx="4"/>
  
  <!-- Task cards -->
  <rect x="45" y="100" width="90" height="30" fill="white" rx="2" stroke="#e2e8f0"/>
  <rect x="45" y="140" width="90" height="30" fill="white" rx="2" stroke="#e2e8f0"/>
  <rect x="155" y="100" width="90" height="30" fill="#fef3c7" rx="2"/>
  <rect x="265" y="100" width="90" height="30" fill="#dcfce7" rx="2"/>
  
  <text x="50" y="85" fill="#64748b" font-family="Arial, sans-serif" font-size="10">To Do</text>
  <text x="160" y="85" fill="#64748b" font-family="Arial, sans-serif" font-size="10">In Progress</text>
  <text x="270" y="85" fill="#64748b" font-family="Arial, sans-serif" font-size="10">Done</text>
</svg>