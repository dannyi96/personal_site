<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Room Loading - All 25 Items</title>
    <link rel="stylesheet" href="src/styles/room.css">
    <link rel="stylesheet" href="src/styles/modals.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        .test-info {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            z-index: 1000;
            max-width: 300px;
        }
        
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 10000;
            transition: opacity 0.5s ease-out;
        }
        
        .loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .loading-text {
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }
        
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .object-count {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="loading-screen" id="loading-screen">
        <div class="loading-text">Loading your interactive experience...</div>
        <div class="loading-spinner"></div>
    </div>

    <div class="test-info">
        <strong>Room Loading Test</strong><br>
        Testing all 58 everyday items:<br>
        • 9 original items<br>
        • 16 previous everyday items<br>
        • 33 new creative items<br>
        • All should load and be clickable<br>
        • Check console for any errors
    </div>
    
    <div class="object-count" id="object-count">
        Objects loaded: 0/58
    </div>

    <div id="room-container"></div>

    <!-- Screen reader announcements -->
    <div id="announcements" aria-live="polite" aria-atomic="true" style="position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden;"></div>

    <script type="module">
        import Room from './src/components/Room/index.js';
        
        class App {
            constructor() {
                this.room = null;
                this.init();
            }
            
            async init() {
                try {
                    console.log('Initializing app...');
                    
                    // Initialize room
                    this.room = new Room();
                    
                    // Wait a bit for room to fully initialize
                    setTimeout(() => {
                        this.hideLoadingScreen();
                        this.countLoadedObjects();
                    }, 2000);
                    
                } catch (error) {
                    console.error('Failed to initialize app:', error);
                    this.hideLoadingScreen();
                }
            }
            
            hideLoadingScreen() {
                const loadingScreen = document.getElementById('loading-screen');
                if (loadingScreen) {
                    loadingScreen.classList.add('hidden');
                    setTimeout(() => {
                        loadingScreen.style.display = 'none';
                    }, 500);
                }
            }
            
            countLoadedObjects() {
                const objectCount = document.getElementById('object-count');
                if (this.room && this.room.objects) {
                    const loadedCount = Object.keys(this.room.objects).length;
                    objectCount.textContent = `Objects loaded: ${loadedCount}/58`;
                    
                    console.log('Loaded objects:', Object.keys(this.room.objects));
                    
                    if (loadedCount === 58) {
                        objectCount.style.background = 'rgba(0, 128, 0, 0.8)';
                        console.log('✅ All 58 objects loaded successfully!');
                    } else {
                        objectCount.style.background = 'rgba(255, 165, 0, 0.8)';
                        console.log('⚠️ Expected 58 objects, got', loadedCount);
                    }
                } else {
                    objectCount.textContent = 'Objects loaded: Error';
                    objectCount.style.background = 'rgba(255, 0, 0, 0.8)';
                    console.log('❌ Room or objects not initialized');
                }
            }
        }
        
        // Initialize app when DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            new App();
        });
        
        // Add error handling
        window.addEventListener('error', (event) => {
            console.error('Global error:', event.error);
        });
        
        window.addEventListener('unhandledrejection', (event) => {
            console.error('Unhandled promise rejection:', event.reason);
        });
    </script>
</body>
</html>
